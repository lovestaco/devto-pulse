<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devto-pulse</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div>
      <h1>devto-pulse</h1>
      <p class="muted" id="status">Loading…</p>
    </div>
    <button id="sync-btn" type="button">Sync now</button>
  </header>

  <main>
    <section class="cards" id="cards"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Portfolio over time</h2>
        <select id="metric">
          <option value="views">Views</option>
          <option value="reactions">Reactions</option>
          <option value="comments">Comments</option>
        </select>
      </div>
      <div class="chart-wrap"><canvas id="history-chart"></canvas></div>
      <p class="muted hint" id="history-hint"></p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Trending</h2>
        <select id="days">
          <option value="1">Last 24 hours</option>
          <option value="7" selected>Last 7 days</option>
          <option value="30">Last 30 days</option>
        </select>
      </div>
      <table id="trending"></table>
    </section>

    <section class="boards">
      <div class="panel"><h2>Most liked</h2><table id="board-likes"></table></div>
      <div class="panel"><h2>Most viewed</h2><table id="board-views"></table></div>
      <div class="panel"><h2>Most commented</h2><table id="board-comments"></table></div>
    </section>

    <section class="panel" id="article-panel" hidden>
      <div class="panel-head">
        <h2 id="article-title"></h2>
        <button type="button" class="ghost" id="article-close">Close</button>
      </div>
      <div class="chart-wrap"><canvas id="article-chart"></canvas></div>
    </section>

    <section class="panel">
      <h2>Sync runs</h2>
      <table id="runs"></table>
    </section>
  </main>
</body>
</html>
